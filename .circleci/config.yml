version: 2.1
commands:
  restore_call_audio:
    steps:
      - checkout:
          path: /tmp/fs-repository
      - run:
          name: Restore exact consolidated source and verified emoji parts V9 (device consent and integration-first gate)
          command: |
            set -euo pipefail
            : "${FS_SOURCE_URL:?Set HTTPS URL of the exact latest source archive}"
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o /tmp/fs-source.zip "$FS_SOURCE_URL"
            echo "ff3bfa30e21b0515d12093978540a9078a9a91358f570a74818eedc3dada4d3f  /tmp/fs-source.zip" | sha256sum -c -
            # Isolate the source from old checkout contents.
            mkdir -p /tmp/fs-release-source
            unzip -oq /tmp/fs-source.zip -d /tmp/fs-release-source
            cp -a /tmp/fs-release-source/. .
            test -f tools/ci_verify.py
            # All 881 original assets restored from six verified release archives.
            release_base="https://github.com/ysedatt25-source/FS-Mesajlasma/releases/download/v34.32-dev.1"
            mkdir -p /tmp/fs-emoji-v4
            printf '%s\n' \
              '149592bb4328fddab97f44847cf23a107aa154904d1b158658b28255928890e6  FS-34.32-Emoji-V4-01.zip' \
              '79f795bb3ef1ab576c244c23a768bb950ec62b2ee78419e4c79ce702a2013542  FS-34.32-Emoji-V4-02.zip' \
              'bcedb7c1b07a92a0f8a06b3e167871e622c28d1b6d19db82c5c0cc7a45153d83  FS-34.32-Emoji-V4-03.zip' \
              '07fcd77c1294378331a9dc46150b7088235cc1522200955e9b4f1141fc5d45d7  FS-34.32-Emoji-V4-04.zip' \
              '98cf0b5502d9e91b1da85257416f339e2d26eb6d30c9645be27c512a676f3768  FS-34.32-Emoji-V4-05.zip' \
              '052b50dd329d1d5a9eee0ce6ba55d1c5d111f91de426429cd12d4407a2697ea0  FS-34.32-Emoji-V4-06.zip' |
            while read -r digest name; do
              curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o "/tmp/fs-emoji-v4/$name" "$release_base/$name"
              printf '%s  %s\n' "$digest" "/tmp/fs-emoji-v4/$name" | sha256sum -c -
              unzip -oq "/tmp/fs-emoji-v4/$name" -d .
              rm -f "/tmp/fs-emoji-v4/$name"
            done
            python3 tools/verify_release_assets.py
            test -f SHA256-ARAMA-SESI.txt
            sha256sum -c SHA256-ARAMA-SESI.txt > /tmp/fs-source-check.log
            # V6: apply only the reviewed test changes AFTER the original manifest passes.
            printf '%s' '' | base64 --decode | gzip -dc > /tmp/fs-regression-v6.patch
            printf '%s  %s\n' '032cb3dc01d558e8edc7559db9949f9ac0af72f628df8186a8fd5f61f17d5cc3' /tmp/fs-regression-v6.patch | sha256sum -c -
            git apply --check --no-index /tmp/fs-regression-v6.patch
            git apply --no-index /tmp/fs-regression-v6.patch
            printf '%s  %s\n' '7e7e6c16e74fdd8c218047287a0904a22335a325c006a2ea315968f222435386' 'tests/interactions.test.mjs' | sha256sum -c -
            printf '%s  %s\n' 'd7b3b749ca57a026f40bed00abb483d2eb56f89b8b8fdefc2eb16fb08e473523' 'tests/dom.test.mjs' | sha256sum -c -
            printf '%s  %s\n' 'ad23b2a3be0e4a18c6ce6c6a1e973156af126b55d3ac16f08d8eb6ac85988a66' 'tests/ui.test.cjs' | sha256sum -c -
            printf '%s  %s\n' '01d3e7a32daff868c1467350186f68f148afe362df8116a88a518de821616647' 'tests/test_call_voice_browser.py' | sha256sum -c -
            # V7: production transport error/cancellation fix and current UI regression selectors.
            printf '%s' '' | base64 --decode | gzip -dc > /tmp/fs-regression-v7.patch
            printf '%s  %s\n' '6d551d43e003afd1d63c0042fb3df72cb40c2fa5c286593451d89c279b175a7c' /tmp/fs-regression-v7.patch | sha256sum -c -
            git apply --check --no-index /tmp/fs-regression-v7.patch
            git apply --no-index /tmp/fs-regression-v7.patch
            printf '%s  %s\n' '91506b22b038d28f801cfa75bc14650f086b8b56c81efa32e2d295b97314bf02' 'web/connection.js' | sha256sum -c -
            printf '%s  %s\n' '67f6970a087fae3edf4171c17a9296e410213e3b8be2b591de1289bd61e4f321' 'tests/connection.test.mjs' | sha256sum -c -
            printf '%s  %s\n' 'f1c02ef92d584e961a8c390fd04a0fb08c00651b081035ce69776bc4c20c27e7' 'tests/ui.test.cjs' | sha256sum -c -
            # V8: current download fault endpoints and accessibility-aware real emoji test.
            printf '%s' '' | base64 --decode | gzip -dc > /tmp/fs-regression-v8.patch
            printf '%s  %s\n' 'cef3a296df530da159e3da3ebd254a8be1987ea072244e657abf3aa52720615e' /tmp/fs-regression-v8.patch | sha256sum -c -
            git apply --check --no-index /tmp/fs-regression-v8.patch
            git apply --no-index /tmp/fs-regression-v8.patch
            printf '%s  %s\n' 'bb04feb85adb8a7766ddb6c397c6503338c7c3303ee9b5a522088d03735afda9' 'tests/dom.test.mjs' | sha256sum -c -
            printf '%s  %s\n' 'ac82b764c2ab997adc70c9073c89967f03d3d32a720828b6d4d5fb8b7a8dc0ac' 'tests/ui.test.cjs' | sha256sum -c -
            printf '%s  %s\n' '5c24ad717366ef5d5416ca8f4c1d03536bf6db036653df4c1174f92f401be1cb' 'tests/test-fixtures.mjs' | sha256sum -c -
            printf '%s  %s\n' 'f576b9d1ce1b2bdfb950c4075366be93058d9d0f23419e51c260a7f0dc31b05f' 'tests/test-fixtures.test.mjs' | sha256sum -c -
            # V9: explicit device-key consent, accessible poll target, integration-first gate.
            printf '%s' '' | base64 --decode | gzip -dc > /tmp/fs-regression-v9.patch
            printf '%s  %s\n' '835193036b2f0b319c7217af97e192876225755b32804199c70b7d40f6ad1eeb' /tmp/fs-regression-v9.patch | sha256sum -c -
            git apply --check --no-index /tmp/fs-regression-v9.patch
            git apply --no-index /tmp/fs-regression-v9.patch
            printf '%s  %s\n' 'ff053596dbcfad036a05b9d476b951bc56f40b2133cce96f952af67b46aba2c1' 'tests/dom.test.mjs' | sha256sum -c -
            printf '%s  %s\n' '587c8e066a561ef6f5a66a099e7a42371ebe9d10c7c8d2f140f19df2feee31dc' 'tests/ui.test.cjs' | sha256sum -c -
            printf '%s  %s\n' 'ebad359695ec1cb826a8fe2b5435a8e6707cf7cdfc4b9b2d7101113629791017' 'tools/ci_verify.py' | sha256sum -c -
jobs:
  regression-tests:
    docker:
      - image: cimg/android:2026.11.1-node
    resource_class: large
    working_directory: ~/fs-release
    steps:
      - restore_call_audio
      - run:
          name: Install pinned test dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y python3-venv
            python3 -m venv .venv
            . .venv/bin/activate
            pip install -r server/requirements.txt playwright==1.57.0
            npm ci --no-audit --no-fund
            python -m playwright install --with-deps chromium
      - run:
          name: Integration first, then all remaining regression suites
          command: |
            . .venv/bin/activate
            export FS_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
            python tools/ci_verify.py
          no_output_timeout: 20m
      - store_artifacts:
          path: build/ci/test-logs
          destination: regression-logs
  android-build:
    docker:
      - image: cimg/android:2026.11.1-node
    resource_class: large
    working_directory: ~/fs-release
    steps:
      - restore_call_audio
      - run:
          name: Build unsigned Android APK with mandatory Firebase client configuration
          command: |
            set -euo pipefail
            bash tools/build_push_ci.sh
            test -s build/push-metadata/build-info.json
            sha256sum build/push-metadata/build-info.json >> build/ci/SHA256SUMS.txt
            sha256sum -c build/ci/SHA256SUMS.txt
          no_output_timeout: 20m
      - persist_to_workspace:
          root: .
          paths:
            - build/ci/FS-Mesajlasma-34.32-native13-push-unsigned.apk
            - build/ci/SHA256SUMS.txt
            - build/push-metadata/build-info.json
  android-sign:
    docker:
      - image: cimg/android:2026.11.1-node
    resource_class: large
    working_directory: ~/fs-release
    steps:
      - restore_call_audio
      - attach_workspace:
          at: .
      - run:
          name: Verify build artifact and sign with existing release certificate
          command: |
            set -euo pipefail
            test -s build/push-metadata/build-info.json
            sha256sum -c build/ci/SHA256SUMS.txt
            sdkmanager 'build-tools;35.0.0'
            bash tools/sign_push_ci.sh
          no_output_timeout: 20m
      - store_artifacts:
          path: build/ci/signed
          destination: signed-device-test-candidate
workflows:
  fs-34-32-final-candidate:
    jobs:
      - regression-tests
      - android-build:
          requires:
            - regression-tests
      - android-sign:
          requires:
            - android-build
          filters:
            branches:
              only: main
          context: fs-release-signing
