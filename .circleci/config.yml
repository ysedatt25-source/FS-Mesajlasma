version: 2.1
commands:
  restore_call_audio:
    steps:
      - checkout:
          path: /tmp/fs-repository
      - run:
          name: Restore verified merged FS 34.32 source
          command: |
            set -euo pipefail
            FS_FINAL_SOURCE_URL="https://github.com/ysedatt25-source/FS-Mesajlasma/releases/download/v34.32-dev.1/FS-34.32-Nihai-Dogrulama-v3-Kaynak-Emoji-Haric.zip"
            FS_FINAL_SOURCE_SHA256=76fc4efb09db3c00d472980bd0f5a3455a2e929f71e1f1b0334fcac44ec7d280
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o /tmp/fs-final.zip "$FS_FINAL_SOURCE_URL"
            printf '%s  %s\n' "$FS_FINAL_SOURCE_SHA256" /tmp/fs-final.zip | sha256sum -c -
            mkdir -p /tmp/fs-final-source
            unzip -oq /tmp/fs-final.zip -d /tmp/fs-final-source
            cp -a /tmp/fs-final-source/. .
            # Restore exact animation assets from existing verified releases.
            release_base="https://github.com/ysedatt25-source/FS-Mesajlasma/releases/download/v34.32-dev.1"
            mkdir -p /tmp/fs-emoji-v4
            printf '%s\n' \
              '149592bb4328fddab97f44847cf23a107aa154904d1b158658b28255928890e6  FS-34.32-Emoji-V4-01.zip' \
              '79f795bb3ef1ab576c244c23a768bb950ec62b2ee78419e4c79ce702a2013542  FS-34.32-Emoji-V4-02.zip' \
              'bcedb7c1b07a92a0f8a06b3e167871e622c28d1b6d19db82c5c0cc7a45153d83  FS-34.32-Emoji-V4-03.zip' \
              '07fcd77c1294378331a9dc46150b7088235cc1522200955e9b4f1141fc5d45d7  FS-34.32-Emoji-V4-04.zip' \
              '98cf0b5502d9e91b1da85257416f339e2d26eb6d30c9645be27c512a676f3768  FS-34.32-Emoji-V4-05.zip' \
              '052b50dd329d1d5a9eee0ce6ba55d1c5d111f91de426429cd12d4407a2697ea0  FS-34.32-Emoji-V4-06.zip' |
            while read -r digest name; do
              curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o "/tmp/fs-emoji-v4/$name" "$release_base/$name"
              printf '%s  %s\n' "$digest" "/tmp/fs-emoji-v4/$name" | sha256sum -c -
              unzip -oq "/tmp/fs-emoji-v4/$name" -d .
              rm -f "/tmp/fs-emoji-v4/$name"
            done
            # The six V4 archives contain ONLY the 881 legacy animations.
            # Restore the remaining 2876 from the already configured, pinned old source.
            : "${FS_SOURCE_URL:?Existing legacy source URL is required to restore extra emoji}"
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o /tmp/fs-legacy-source.zip "$FS_SOURCE_URL"
            printf '%s  %s\n' 'ff3bfa30e21b0515d12093978540a9078a9a91358f570a74818eedc3dada4d3f' /tmp/fs-legacy-source.zip | sha256sum -c -
            unzip -oq /tmp/fs-legacy-source.zip 'web/emoji-extra/*.webp' -d .
            rm -f /tmp/fs-legacy-source.zip
            python3 tools/verify_release_assets.py
            if ! sha256sum -c FS-FINAL-SHA256.txt > /tmp/fs-source-check.log 2>&1; then
              grep -v ': OK$' /tmp/fs-source-check.log | head -80 || true
              exit 1
            fi
            echo "All 5089 source files verified (including all 3757 emoji assets)."
            # The expanded voice speed sequence intentionally includes 1.25x and 1.75x.
            # Verify the original release first, then apply the same hash-pinned test correction in every job.
            python3 - <<'PYDOM'
            from pathlib import Path
            import hashlib
            p = Path('tests/dom.test.mjs')
            raw = p.read_bytes()
            old = b'const speed=document.querySelector(\'[data-action="audio-speed"]\');speed.click();assert.equal(speed.textContent,\'1.5\xc3\x97\');const audio=document.querySelector(\'audio[data-audio]\');assert.equal(audio.playbackRate,1.5);'
            new = b'const speed=document.querySelector(\'[data-action="audio-speed"]\');const audio=document.querySelector(\'audio[data-audio]\');assert.equal(audio.playbackRate,1);for(const rate of [1.25,1.5,1.75,2,1,1.25,1.5]){speed.click();assert.equal(speed.textContent,rate+\'\xc3\x97\');assert.equal(audio.playbackRate,rate);}'
            expected_old = 'd266f93abbf76c32b63117c081cf1533d70b668f82f5c9dd15cbb0d5c35db448'
            expected_new = 'd972ff19b47949b4db4daf2a765a6de59949e9288b56ac521631f20bc1f35969'
            assert hashlib.sha256(raw).hexdigest() == expected_old, 'Unexpected original DOM test'
            assert raw.count(old) == 1, 'Voice speed test anchor missing or duplicated'
            fixed = raw.replace(old, new)
            assert hashlib.sha256(fixed).hexdigest() == expected_new, 'Updated test digest mismatch'
            manifest = Path('FS-FINAL-SHA256.txt')
            raw_manifest = manifest.read_bytes()
            old_entry = (expected_old + '  tests/dom.test.mjs').encode()
            new_entry = (expected_new + '  tests/dom.test.mjs').encode()
            assert raw_manifest.count(old_entry) == 1, 'Original manifest entry missing or duplicated'
            p.write_bytes(fixed)
            manifest.write_bytes(raw_manifest.replace(old_entry, new_entry))
            print('DOM playback test updated: all five speeds, wraparound, and 1.5x persistence remain mandatory.')
            PYDOM
            sha256sum -c FS-FINAL-SHA256.txt > /tmp/fs-source-check.log
            echo "Corrected regression source manifest verified."
jobs:
  regression-tests:
    docker:
      - image: cimg/android:2026.11.1-node
    resource_class: large
    working_directory: ~/fs-release
    steps:
      - restore_call_audio
      - run:
          name: Install pinned test dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y python3-venv
            python3 -m venv .venv
            . .venv/bin/activate
            pip install -r server/requirements.txt playwright==1.57.0
            npm ci --no-audit --no-fund
            python -m playwright install --with-deps chromium
      - run:
          name: All regression suites (collect all failures; block APK on any failure)
          command: |
            . .venv/bin/activate
            export FS_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
            python tools/ci_verify.py
            python tools/ci_source_identity.py record-tests
          no_output_timeout: 20m
      - store_artifacts:
          path: build/ci/test-logs
          destination: regression-logs
      - persist_to_workspace:
          root: .
          paths:
            - build/ci/test-logs/results.json
            - build/ci/regression-source.json
  android-build:
    docker:
      - image: cimg/android:2026.11.1-node
    resource_class: large
    working_directory: ~/fs-release
    steps:
      - restore_call_audio
      - attach_workspace:
          at: .
      - run:
          name: Build unsigned Android APK with mandatory Firebase client configuration
          command: |
            set -euo pipefail
            python3 tools/ci_source_identity.py check-tests
            bash tools/build_push_ci.sh
            test -s build/push-metadata/build-info.json
            sha256sum build/push-metadata/build-info.json >> build/ci/SHA256SUMS.txt
            sha256sum -c build/ci/SHA256SUMS.txt
            python3 tools/ci_source_identity.py record-build
          no_output_timeout: 20m
      - store_artifacts:
          path: build/ci/SHA256SUMS.txt
          destination: unsigned-build-checksums.txt
      - persist_to_workspace:
          root: .
          paths:
            - build/ci/FS-Mesajlasma-34.32-native13-push-unsigned.apk
            - build/ci/SHA256SUMS.txt
            - build/ci/build-source.json
            - build/push-metadata/build-info.json
  android-sign:
    docker:
      - image: cimg/android:2026.11.1-node
    resource_class: large
    working_directory: ~/fs-release
    steps:
      - restore_call_audio
      - attach_workspace:
          at: .
      - run:
          name: Verify build artifact and sign with existing release certificate
          command: |
            set -euo pipefail
            test -s build/push-metadata/build-info.json
            sha256sum -c build/ci/SHA256SUMS.txt
            python3 tools/ci_source_identity.py check-build
            sdkmanager 'build-tools;35.0.0'
            bash tools/sign_push_ci.sh
          no_output_timeout: 20m
      - store_artifacts:
          path: build/ci/signed
          destination: signed-device-test-candidate
workflows:
  fs-34-32-final-candidate:
    jobs:
      - regression-tests
      - android-build:
          requires:
            - regression-tests
      - android-sign:
          requires:
            - android-build
          filters:
            branches:
              only: main
          context: fs-release-signing
