
version: 2.1
jobs:
  regression-tests:
    docker:
      - image: cimg/android:2026.11.1-node
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Restore verified Native12 tests3 source
          command: |
            mkdir -p build/ci
            curl --fail --location --retry 3 -o /tmp/fs-source.zip https://github.com/ysedatt25-source/FS-Mesajlasma/releases/download/v34.32-dev.1/FS-source-34.32-native12-tests3.zip
            echo "664d42fad31c3ec159dbfdac9aad2928b856eaad14e74e01497f5190c3ea0d34  /tmp/fs-source.zip" | sha256sum -c -
            unzip -oq /tmp/fs-source.zip
      - run:
          name: Install pinned test dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y python3-venv
            python3 -m venv .venv
            .venv/bin/pip install -r server/requirements.txt
            npm ci
            node --version
            npm --version
            python3 --version
      - run:
          name: Server and database tests
          when: always
          command: |
            set -o pipefail
            mkdir -p build/ci
            . .venv/bin/activate
            rc=0
            for suite in test_server.py test_database.py test_turn.py; do
              python -m unittest discover -s tests -p "$suite" -v 2>&1 | tee "build/ci/$suite.log" || rc=1
            done
            exit "$rc"
      - run:
          name: JavaScript regression tests
          when: always
          command: |
            set -o pipefail
            node --test --test-concurrency=1 tests/*.test.mjs 2>&1 | tee build/ci/javascript-tests.log
      - run:
          name: Full isolated DOM integration
          when: always
          command: |
            set -o pipefail
            . .venv/bin/activate
            node tests/dom.test.mjs 2>&1 | tee build/ci/dom-tests.log
      - run:
          name: Real Chromium component checks
          when: always
          command: |
            set -o pipefail
            . .venv/bin/activate
            pip install playwright==1.57.0
            python -m playwright install --with-deps chromium
            rc=0
            for suite in test_calculator_dom.py test_remaining_browser.py test_emoji_ack_browser.py test_chat_viewport_dom.py test_latest_button_dom.py test_composer_dom.py; do
              python "tests/$suite" 2>&1 | tee "build/ci/$suite.log" || rc=1
            done
            exit "$rc"
      - run:
          name: Preserve reproducible dependencies if any check fails
          when: on_fail
          command: |
            mkdir -p build/ci
            if [ -d node_modules ]; then
              tar -czf build/ci/npm-test-dependencies.tar.gz node_modules package.json package-lock.json
            fi
      - store_artifacts:
          path: build/ci
          destination: fs-native12-tests3
workflows:
  native12-tests3:
    jobs:
      - regression-tests
