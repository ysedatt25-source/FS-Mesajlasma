version: 2.1
commands:
  restore_madde17:
    steps:
      - checkout
      - run:
          name: Restore exact consolidated source (no legacy fallback)
          command: |
            FS_SOURCE_URL="https://github.com/ysedatt25-source/FS-Mesajlasma/releases/download/v34.32-dev.1/FS-34.32-Tek-Kaynak-Paketi.zip"
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o /tmp/fs-source.zip "$FS_SOURCE_URL"
            echo "83de006dcd53949f58aa0c0be920af03a425c6447fca1944ac0494cd1bf1489b  /tmp/fs-source.zip" | sha256sum -c -
            unzip -oq /tmp/fs-source.zip
            python3 tools/fetch_assets.py
            test -f tools/ci_verify.py
            test -f source-madde17.sha256
            sha256sum -c source-madde17.sha256 > /tmp/fs-source-check.log
            curl --fail --location --retry 3 -o /tmp/fs-ci-fix.zip https://github.com/ysedatt25-source/FS-Mesajlasma/releases/download/v34.32-dev.1/FS-34.32-CI-Hata-Duzeltme-01.zip
            echo "ccf7fe005f1314a039c4728aa0031edaa1df1a7b1c30f5eef1d2d9da3d61ea36  /tmp/fs-ci-fix.zip" | sha256sum -c -
            unzip -oq /tmp/fs-ci-fix.zip
            sha256sum -c source-madde17.sha256 > /tmp/fs-patched-source-check.log
            curl --fail --location --retry 3 -o /tmp/fs-ci-fix02.zip https://github.com/ysedatt25-source/FS-Mesajlasma/releases/download/v34.32-dev.1/FS-34.32-CI-Hata-Duzeltme-02.zip
            echo "43099b657fa89b80ca617c989c0747a40a152ceea79e22da32788f9c7473cf93  /tmp/fs-ci-fix02.zip" | sha256sum -c -
            unzip -oq /tmp/fs-ci-fix02.zip
            sha256sum -c source-madde17.sha256 > /tmp/fs-patched-source02-check.log
jobs:
  regression-tests:
    docker:
      - image: cimg/android:2026.11.1-node
    resource_class: large
    steps:
      - restore_madde17
      - run:
          name: Install pinned test dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y python3-venv
            python3 -m venv .venv
            . .venv/bin/activate
            pip install -r server/requirements.txt playwright==1.57.0
            npm ci --no-audit --no-fund
            python -m playwright install --with-deps chromium
      - run:
          name: All regression suites (failures are not suppressed)
          command: |
            . .venv/bin/activate
            export FS_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
            python tools/ci_verify.py
          no_output_timeout: 20m
      - store_artifacts:
          path: build/ci/test-logs
          destination: regression-logs
  android-build:
    docker:
      - image: cimg/android:2026.11.1-node
    resource_class: large
    steps:
      - restore_madde17
      - run:
          name: Build unsigned Android APK with mandatory Firebase client configuration
          command: bash tools/build_push_ci.sh
          no_output_timeout: 20m
      - store_artifacts:
          path: build/ci
          destination: madde17-unsigned
workflows:
  madde17:
    jobs:
      - regression-tests
      - android-build:
          requires:
            - regression-tests
