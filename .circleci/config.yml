version: 2.1
commands:
  restore_call_audio:
    steps:
      - checkout:
          path: /tmp/fs-repository
      - run:
          name: Restore exact consolidated source and verified emoji parts V4
          command: |
            set -euo pipefail
            : "${FS_SOURCE_URL:?Set HTTPS URL of the exact latest source archive}"
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o /tmp/fs-source.zip "$FS_SOURCE_URL"
            echo "ff3bfa30e21b0515d12093978540a9078a9a91358f570a74818eedc3dada4d3f  /tmp/fs-source.zip" | sha256sum -c -
            mkdir -p /tmp/fs-release-source
            unzip -oq /tmp/fs-source.zip -d /tmp/fs-release-source
            cp -a /tmp/fs-release-source/. .
            test -f tools/ci_verify.py
            release_base="https://github.com/ysedatt25-source/FS-Mesajlasma/releases/download/v34.32-dev.1"
            mkdir -p /tmp/fs-emoji-v4
            while read -r digest name; do
              curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' -o "/tmp/fs-emoji-v4/$name" "$release_base/$name"
              printf '%s  %s\n' "$digest" "/tmp/fs-emoji-v4/$name" | sha256sum -c -
              unzip -oq "/tmp/fs-emoji-v4/$name" -d .
              rm -f "/tmp/fs-emoji-v4/$name"
            done <<'FS_EMOJI_V4_HASHES'
            149592bb4328fddab97f44847cf23a107aa154904d1b158658b28255928890e6  FS-34.32-Emoji-V4-01.zip
            79f795bb3ef1ab576c244c23a768bb950ec62b2ee78419e4c79ce702a2013542  FS-34.32-Emoji-V4-02.zip
            bcedb7c1b07a92a0f8a06b3e167871e622c28d1b6d19db82c5c0cc7a45153d83  FS-34.32-Emoji-V4-03.zip
            07fcd77c1294378331a9dc46150b7088235cc1522200955e9b4f1141fc5d45d7  FS-34.32-Emoji-V4-04.zip
            98cf0b5502d9e91b1da85257416f339e2d26eb6d30c9645be27c512a676f3768  FS-34.32-Emoji-V4-05.zip
            052b50dd329d1d5a9eee0ce6ba55d1c5d111f91de426429cd12d4407a2697ea0  FS-34.32-Emoji-V4-06.zip
            FS_EMOJI_V4_HASHES
            python3 tools/verify_release_assets.py
            test -f SHA256-ARAMA-SESI.txt
            sha256sum -c SHA256-ARAMA-SESI.txt > /tmp/fs-source-check.log
jobs:
  regression-tests:
    docker:
      - image: cimg/android:2026.11.1-node
    resource_class: large
    working_directory: ~/fs-release
    steps:
      - restore_call_audio
      - run:
          name: Install pinned test dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y python3-venv
            python3 -m venv .venv
            . .venv/bin/activate
            pip install -r server/requirements.txt playwright==1.57.0
            npm ci --no-audit --no-fund
            python -m playwright install --with-deps chromium
      - run:
          name: All regression suites (failures are not suppressed)
          command: |
            . .venv/bin/activate
            export FS_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
            python tools/ci_verify.py
          no_output_timeout: 20m
      - store_artifacts:
          path: build/ci/test-logs
          destination: regression-logs
  android-build:
    docker:
      - image: cimg/android:2026.11.1-node
    resource_class: large
    working_directory: ~/fs-release
    steps:
      - restore_call_audio
      - run:
          name: Build unsigned Android APK with mandatory Firebase client configuration
          command: |
            set -euo pipefail
            bash tools/build_push_ci.sh
            test -s build/push-metadata/build-info.json
            sha256sum build/push-metadata/build-info.json >> build/ci/SHA256SUMS.txt
            sha256sum -c build/ci/SHA256SUMS.txt
          no_output_timeout: 20m
      - persist_to_workspace:
          root: .
          paths:
            - build/ci/FS-Mesajlasma-34.32-native13-push-unsigned.apk
            - build/ci/SHA256SUMS.txt
            - build/push-metadata/build-info.json
  android-sign:
    docker:
      - image: cimg/android:2026.11.1-node
    resource_class: large
    working_directory: ~/fs-release
    steps:
      - restore_call_audio
      - attach_workspace:
          at: .
      - run:
          name: Verify build artifact and sign with existing release certificate
          command: |
            set -euo pipefail
            test -s build/push-metadata/build-info.json
            sha256sum -c build/ci/SHA256SUMS.txt
            sdkmanager 'build-tools;35.0.0'
            bash tools/sign_push_ci.sh
          no_output_timeout: 20m
      - store_artifacts:
          path: build/ci/signed
          destination: signed-device-test-candidate
workflows:
  fs-34-32-final-candidate:
    jobs:
      - regression-tests
      - android-build:
          requires:
            - regression-tests
      - android-sign:
          requires:
            - android-build
          filters:
            branches:
              only: main
          context: fs-release-signing
